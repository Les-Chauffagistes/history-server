services:
  app:
    build:
      context: .
      secrets:
        - pipindex
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    env_file: .env
    ports:
      - "${PORT:-8050}:8050"
    environment:
      PORT: "8050"
      DB_HOST: timescaledb
      DB_NAME: chauffagistes
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8050/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  timescaledb:
    image: timescale/timescaledb-ha:pg17
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: chauffagistes
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d chauffagistes"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

secrets:
  pipindex:
    environment: PIP_EXTRA_INDEX_URL

volumes:
  pgdata:
