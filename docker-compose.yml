services:
  app:
    image: history-server:v1
    restart: unless-stopped
    env_file: .env
    ports:
      - "${PORT:-8050}:8050"
    environment:
      PORT: "8050"
      POSTGRE_HOST: timescaledb
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8050/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  timescaledb:
    image: timescale/timescaledb-ha:pg17
    restart: unless-stopped
    ports:
      - "${POSTGRE_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRE_USER}
      POSTGRES_PASSWORD: ${POSTGRE_PASSWORD}
      POSTGRES_DB: chauffagistes
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRE_USER} -d chauffagistes"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

volumes:
  pgdata:
